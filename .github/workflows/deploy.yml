name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit fixtures
        run: npm test

      - name: Generate service worker precache
        run: npm run build:sw

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          # App shell + assets (exclude tooling / docs / tests)
          shopt -s dotglob nullglob
          for item in *; do
            case "$item" in
              node_modules|e2e|test-results|playwright-report|blob-report|docs|scripts|_site|.git|.github)
                ;;
              *)
                cp -a "$item" _site/
                ;;
            esac
          done
          # Keep relative-path contract: no absolute src=/href=/
          if grep -REq 'src="/|href="/' _site/index.html; then
            echo "Absolute asset paths found in index.html" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
